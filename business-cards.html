<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InformationBank — 10-up A4 business cards</title>
<style>
:root{--blue:#2459d6;--ink:#151923;--cream:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:#eef1f7;color:var(--ink);font:16px/1.4 Arial,Helvetica,sans-serif}
.toolbar{max-width:900px;margin:24px auto;padding:16px 20px;background:white;border-radius:12px}
.toolbar h1{margin:0 0 8px;font-size:22px}.toolbar p{margin:6px 0;color:#536078}
.toolbar button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer}
.sheet{width:7in;height:10in;margin:24px auto;background:white;display:grid;grid-template-columns:repeat(2,3.5in);grid-template-rows:repeat(5,2in);box-shadow:0 4px 24px #15213a22}
.card{width:3.5in;height:2in;position:relative;overflow:hidden;background:var(--cream);border:1px solid #161616;padding:.13in .16in;display:flex}
.card:before{content:"";position:absolute;inset:5px;border:1.5px solid #171717;border-radius:12px;pointer-events:none}
.check{position:absolute;width:48px;height:48px;right:0;bottom:0;background:conic-gradient(#111 25%,transparent 0 50%,#111 0 75%,transparent 0);background-size:24px 24px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.brandmark{font-size:48px;line-height:.9;font-weight:900;color:var(--blue);width:.42in;flex:none;text-align:center;margin-top:.08in}
.front-main{padding:.2in .04in 0 .03in;min-width:0;flex:1;overflow:hidden}
.brand{font-size:16px;font-weight:900;letter-spacing:-.65px;white-space:nowrap;line-height:1.15}
.slogan{font-size:12px;font-weight:800;font-style:italic;line-height:1.2;margin-top:8px;max-width:1.72in}
.rule{height:3px;background:var(--blue);width:1.55in;margin:7px 0}
.mini{font-size:7px;font-weight:800;letter-spacing:.6px;white-space:nowrap}
.qrwrap{width:.88in;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:1}
.qrwrap img{width:.78in;height:.78in;image-rendering:auto}
.qrlabel{font-size:8px;font-weight:800;text-align:center}
.back{align-items:center;padding:.18in .2in}
.back-logo{width:1.22in;flex:none;text-align:center}
.back-logo .q{font-size:64px;line-height:.85;font-weight:900;color:var(--blue)}
.back-logo .name{font-size:15px;font-weight:900;letter-spacing:-.6px}
.back-logo .tag{font-size:8px;font-weight:800;font-style:italic;line-height:1.2;margin-top:6px}
.back-divider{height:1.35in;width:2px;background:#171717;margin:0 .18in 0 .08in}
.back-info{font-size:10px;line-height:1.4;max-width:1.7in;overflow-wrap:anywhere}
.back-info .url{font-weight:800;font-size:9px}
.back-info .line{margin:7px 0}
.back-info .footer{font-size:8px;font-weight:900;letter-spacing:1px;margin-top:10px;white-space:nowrap}
.sheet-label{text-align:center;color:#69758a;font-size:13px;margin:12px auto}
@page{size:A4 portrait;margin:0}
@media print{
 body{background:white}
 .toolbar,.sheet-label{display:none!important}
 .sheet{margin:0;width:7in;height:10in;box-shadow:none;break-after:page;page-break-after:always}
 .sheet:last-of-type{break-after:auto;page-break-after:auto}
}
@media screen and (max-width:760px){.sheet{transform:scale(.72);transform-origin:top center;margin-bottom:-2.7in}}
</style>
</head>
<body>
<div class="toolbar">
<h1>InformationBank business cards</h1>
<p>10 cards per A4 sheet. Print both pages double-sided at 100% scale. Choose <b>flip on long edge</b>. Page 1 is the front; page 2 is the back.</p>
<button onclick="window.print()">Print / Save as PDF</button>
</div>
<div class="sheet" id="front" aria-label="Front sides — ten cards"></div>
<div class="sheet-label">Page 1 — Front of card (10 copies)</div>
<div class="sheet" id="back" aria-label="Back sides — ten cards"></div>
<div class="sheet-label">Page 2 — Back of card (10 copies)</div>
<script>
const site="https://informashonbank.github.io/Informationbank/";
const qr="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=4&data="+encodeURIComponent(site);
function frontCard(){return `
<article class="card">
<div class="brandmark">?</div>
<div class="front-main"><div class="brand">InformationBank</div>
<div class="slogan">Explore the world<br>one idea at a time.</div>
<div class="rule"></div><div class="mini">SEARCH&nbsp; • &nbsp;LEARN&nbsp; • &nbsp;DISCOVER</div></div>
<div class="qrwrap"><img src="${qr}" alt="QR code linking to InformationBank"><div class="qrlabel">SCAN TO VISIT</div></div><div class="check"></div>
</article>`}
function backCard(){return `
<article class="card back">
<div class="back-logo"><div class="q">?</div><div class="name">InformationBank</div><div class="tag">Explore the world<br>one idea at a time.</div></div>
<div class="back-divider"></div>
<div class="back-info"><div class="line"><b>VISIT THE WEBSITE</b></div><div class="url">informashonbank.github.io/<br>Informationbank/</div>
<div class="line">Search. Learn. Discover.</div><div class="line">Information for everyone.</div><div class="footer">EXPLORE • LEARN • DISCOVER</div></div><div class="check"></div>
</article>`}
document.getElementById("front").innerHTML=Array.from({length:10},frontCard).join("");
document.getElementById("back").innerHTML=Array.from({length:10},backCard).join("");
</script>
</body>
</html>

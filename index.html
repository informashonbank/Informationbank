<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InformationBank — a curious place to explore science, technology, history, nature, space, and geography.">
  <title>InformationBank — Explore what matters</title>
  <style>
    :root{--ink:#17233b;--muted:#64748b;--paper:#f7f8fc;--card:#fff;--blue:#3157d5;--line:#e6eaf2}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 40px));margin:auto}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:9px;font-size:1.05rem;font-weight:850;letter-spacing:-.04em}.brand span{color:var(--blue)}.brand-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#eaf0ff;color:var(--blue);font-size:1.55rem;font-weight:900;line-height:1}
    .nav small{color:var(--muted)}
    .hero{padding:58px 0 54px;background:linear-gradient(180deg,#fff,#f7f9ff);text-align:center}.hero .wrap{display:flex;flex-direction:column;align-items:center}.search-logo{color:var(--blue);font-size:clamp(7rem,18vw,11rem);font-weight:900;line-height:.88;letter-spacing:-.1em;text-shadow:0 8px 24px #3157d51c;margin:0 0 12px;user-select:none}.hero h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:8px 0 12px;letter-spacing:-.055em}.hero p{margin:0 auto;max-width:580px}.hero .eyebrow{margin-bottom:8px}
    .eyebrow{color:var(--blue);font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.13em}
    h1{font-size:clamp(2.5rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.065em;max-width:760px;margin:15px 0}
    .hero p{color:var(--muted);max-width:620px;font-size:1.1rem}
    .search{display:flex;gap:10px;width:min(720px,100%);margin-top:30px;padding:7px;background:#fff;border:1px solid #d9dfeb;border-radius:999px;box-shadow:0 5px 24px #26395c12}.search:focus-within{border-color:#9aafea;box-shadow:0 5px 26px #3157d522}.search input{flex:1;min-width:0;padding:12px 18px;border:0;outline:0;border-radius:999px;font:inherit;background:transparent}.search .primary{border-radius:999px;padding:12px 24px}
    button{cursor:pointer;font:inherit}.primary{border:0;background:var(--blue);color:white;padding:14px 20px;border-radius:12px;font-weight:750}
    main{padding:46px 0 80px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
    h2{font-size:1.65rem;letter-spacing:-.04em;margin:0}.muted{color:var(--muted)}
    .categories{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 36px}.chip{border:1px solid var(--line);background:white;color:#40506b;padding:9px 14px;border-radius:99px;font-weight:650}
    .chip.active,.chip:hover{background:#eaf0ff;border-color:#cbd8ff;color:#2447bd}
    .grid{display:grid;grid-template-columns:1fr;gap:14px;max-width:820px;margin:0 auto}.results-wrap{max-width:820px;margin:0 auto}.section-head{max-width:820px;margin-left:auto;margin-right:auto}
    .article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-height:0;display:flex;flex-direction:column;box-shadow:0 3px 14px #1b2b4a08}
    .article .tag{font-size:.75rem;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .article h3{font-size:1.22rem;line-height:1.25;letter-spacing:-.03em;margin:12px 0 8px}
    .article p{color:var(--muted);margin:0 0 12px}.article button{margin-top:4px;align-self:flex-start;background:none;border:0;padding:0;color:var(--blue);font-weight:800}.external-result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 3px 14px #1b2b4a08}.external-result .domain{font-size:.84rem;color:#64748b}.external-result h3{font-size:1.25rem;margin:6px 0;color:#2453c7}.external-result p{margin:0;color:#526078}.external-result a:hover h3{text-decoration:underline}
    .empty{grid-column:1/-1;background:white;border:1px dashed #cbd5e1;padding:35px;border-radius:16px;text-align:center;color:var(--muted)}
    footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.9rem}
    dialog{border:0;border-radius:20px;padding:0;width:min(680px,calc(100% - 28px));max-height:85vh;box-shadow:0 25px 90px #101b3380}
    dialog::backdrop{background:#111c34a8}.modal{padding:30px}.modal h2{margin:8px 0 16px}.modal p{white-space:pre-wrap;color:#43516a}.close{float:right;border:1px solid var(--line);background:white;border-radius:9px;padding:7px 11px}
    @media(max-width:800px){.hero{padding:62px 0 42px}}
    @media(max-width:560px){.search{gap:4px;padding:5px}.search input{padding:11px 12px}.search .primary{padding:11px 16px}.section-head{align-items:start;flex-direction:column}.nav small{display:none}}
  </style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="#" aria-label="InformationBank home"><span class="brand-mark">?</span>Information<span>Bank</span></a><small>Search the web</small></div></header>
<section class="hero"><div class="wrap">
  <div class="search-logo" aria-label="InformationBank question mark logo">?</div>
  <h1>InformationBank</h1>
  <p>Search the web with Google. Enter a question, topic, or website below.</p>
  <form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="Search Google or type a URL…" aria-label="Search the web and InformationBank"><button class="primary">Search</button></form>
</div></section>
<main class="wrap">
  <div class="section-head"><div><div class="eyebrow">Browse topics</div><h2>Explore categories</h2></div><span class="muted" id="count"></span></div>
  <div class="categories" id="categories"><button class="chip active" data-category="all">All topics</button></div>
  <div class="section-head"><h2 id="resultsTitle">Popular information</h2><span class="muted">Search the entire web</span></div>
  <section class="grid" id="articles" aria-live="polite"><div class="empty">Loading the library…</div></section>
</main>
<footer><div class="wrap">© <span id="year"></span> InformationBank. Keep asking questions.</div></footer>
<dialog id="articleDialog"><div class="modal"><button class="close" id="closeDialog" aria-label="Close">Close</button><div class="eyebrow" id="modalCategory"></div><h2 id="modalTitle"></h2><div class="muted" id="modalMeta"></div><p id="modalContent"></p></div></dialog>
<script>
  const SUPABASE_URL = "https://uiwzpapmsxqmvolknafk.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BznsuKCxYP9wHUPe6_jp8g_fU6wSKlw";
  const headers = {"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY};
  let allArticles = [], activeCategory = "all", searchTerm = "";
  const $ = id => document.getElementById(id);
  $("year").textContent = new Date().getFullYear();
  async function api(path){
    const response = await fetch(SUPABASE_URL + "/rest/v1/" + path, {headers});
    if(!response.ok) throw new Error("Library request failed ("+response.status+").");
    return response.json();
  }
  function renderCategories(categories){
    const host = $("categories"); host.innerHTML = "";
    const all = document.createElement("button"); all.className = "chip active"; all.dataset.category = "all"; all.textContent = "All topics"; host.append(all);
    categories.forEach(category => { const button = document.createElement("button"); button.className = "chip"; button.dataset.category = category.slug; button.textContent = category.name; host.append(button); });
    host.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]"); if(!button) return;
      activeCategory = button.dataset.category;
      host.querySelectorAll(".chip").forEach(chip => chip.classList.toggle("active", chip === button));
      renderArticles();
    });
  }
  function renderArticles(){
    const filtered = allArticles.filter(article => {
      const categoryMatch = activeCategory === "all" || article.categories?.slug === activeCategory;
      const haystack = (article.title+" "+article.summary+" "+(article.categories?.name||"")).toLowerCase();
      return categoryMatch && haystack.includes(searchTerm);
    });
    const showChessSite = /\bchess\b/i.test(searchTerm);
    $("count").textContent = filtered.length + (filtered.length === 1 ? " article" : " articles") + (showChessSite ? " · 1 website" : "");
    $("resultsTitle").textContent = searchTerm ? "Search results" : activeCategory === "all" ? "Popular information" : "Explore "+activeCategory;
    const host = $("articles"); host.innerHTML = "";
    if(showChessSite){
      const result = document.createElement("article"); result.className = "external-result";
      const domain = document.createElement("div"); domain.className = "domain"; domain.textContent = "https://themaxchessss.github.io";
      const link = document.createElement("a"); link.href = "https://themaxchessss.github.io/"; link.target = "_blank"; link.rel = "noopener noreferrer";
      const title = document.createElement("h3"); title.textContent = "TheMaxChess";
      const description = document.createElement("p"); description.textContent = "Visit TheMaxChess website.";
      link.append(title,description); result.append(domain,link); host.append(result);
    }
    if(!filtered.length && !showChessSite){host.innerHTML = '<div class="empty">No results found. Try another search.</div>';return;}
    filtered.forEach(article => {
      const card = document.createElement("article"); card.className = "article";
      const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = article.categories?.name || "Article";
      const title = document.createElement("h3"); title.textContent = article.title;
      const summary = document.createElement("p"); summary.textContent = article.summary;
      const read = document.createElement("button"); read.textContent = "Read article →"; read.addEventListener("click", () => openArticle(article));
      card.append(tag,title,summary,read); host.append(card);
    });
  }
  function openArticle(article){
    $("modalCategory").textContent = article.categories?.name || "InformationBank";
    $("modalTitle").textContent = article.title; $("modalMeta").textContent = (article.read_minutes || 3) + " min read";
    $("modalContent").textContent = article.content; $("articleDialog").showModal();
  }
  $("closeDialog").addEventListener("click", () => $("articleDialog").close());
  $("articleDialog").addEventListener("click", event => {if(event.target === $("articleDialog")) $("articleDialog").close();});
  $("searchForm").addEventListener("submit", event => {
    event.preventDefault();
    const query = $("searchInput").value.trim();
    if(!query) return;
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
  });
  $("searchInput").addEventListener("input", () => {
    searchTerm=$("searchInput").value.trim().toLowerCase();
    renderArticles();
  });
  async function start(){
    try{
      const [categories, articles] = await Promise.all([
        api("categories?select=id,name,slug,description,sort_order&order=sort_order.asc"),
        api("articles?select=id,title,slug,summary,content,read_minutes,published_at,categories(name,slug)&status=eq.published&order=published_at.desc")
      ]);
      allArticles = articles; renderCategories(categories); renderArticles();
    }catch(error){
      $("articles").innerHTML = '<div class="empty">The library could not load. Check the Supabase project URL, publishable key, and database policies in README.md.</div>';
      console.error(error);
    }
  }
  start();
</script>
</body>
</html>
